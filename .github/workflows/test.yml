# A pre-commit hook only protects the machine it is installed on, and this
# repo publishes straight to GitHub Pages on push - there is no review step
# between a bad commit and the live site. So the same checks run here too,
# where they cannot be skipped with --no-verify and do not depend on anyone
# having set their clone up correctly.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs rather than version tags. A tag is a pointer and
      # can be moved: anyone who takes over one of these repos, or an action
      # release that is republished, changes what runs here without a single
      # line of this file changing. These are GitHub's own actions and the risk
      # is small, but they run with the repo checked out and this is the only
      # thing standing between a push and the live site. The comment beside
      # each SHA is what it pointed at when it was pinned, and is the thing to
      # check against when bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sitemap.py reads each page's last commit date out of git log.
          # The default shallow clone has one commit, so every lastmod
          # would read as today and the check below would pass on a lie.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Node is here for one test: it parses the page's inline JS with
      # node --check, and skips itself if node is missing. A skip in CI reads
      # as a pass, so the runtime has to actually be installed for that check
      # to mean anything. 24 because 20 went end-of-life in April 2026.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # The suite drives a real browser because most of what can break on this
      # page - a filter that snaps instead of interpolating, an animation
      # outranking a class, a contrast ratio - is only observable in one.
      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Tests
        run: python tools/test_page.py

      # Both of these are generated files, and a generated file that has
      # drifted from its source fails silently: a stale <lastmod> tells a
      # crawler not to bother re-fetching, and a stale CSP hash makes the
      # browser drop the script without a word. Neither shows up in a
      # page test. schema.py is deliberately NOT here - it reads the live
      # calendar through a management token that does not exist on a
      # runner and must not.
      - name: Sitemap dates current
        run: python tools/sitemap.py --check

      - name: CSP hashes current
        run: python tools/csp.py --check

      # Scans the whole tree, not just the push, so a credential committed
      # before this workflow existed is still caught.
      - name: No live credentials
        run: python tools/secretscan.py --all
