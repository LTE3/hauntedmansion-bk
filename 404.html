<style>
/* The typefaces, served from this origin.

   They used to come from fonts.googleapis.com, which meant a DNS lookup, a
   TLS handshake and a stylesheet round trip had to finish before the browser
   even learned the URL of a single font file - 376ms of blocked render, at
   the front of a page whose entire job is to be looked at immediately. It
   also handed every visitor's IP address to a third party, on a site that
   publishes a page saying what it collects.

   These are the same files byte for byte: fetched from Google, exactly the
   woff2s the link tag pulled. What is gone is the faces nothing selected -
   the link asked for seven and four were ever used. font-display:swap keeps
   the words readable while they load, and the unicode-range split means the
   accented file is fetched only if a glyph in it is actually needed, which
   for most visitors is never. */
@font-face{font-family:"Cinzel";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/cinzel-400-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"Cinzel";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/cinzel-400-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:300;font-display:swap;src:url(fonts/cormorant-garamond-300-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:300;font-display:swap;src:url(fonts/cormorant-garamond-300-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
:root{
  color-scheme:dark;
  --ink:#050505;
  --bone:#cfc4b4;
  --ash:#82796f;
  --blood-lit:#c9342a;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --display:"Cinzel","Cormorant Garamond",Georgia,serif;
  --slow:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100svh;background:var(--ink);color:var(--bone);
  font-family:var(--serif);-webkit-font-smoothing:antialiased;
  display:grid;place-content:center;text-align:center;gap:3.4rem;padding:12vh 8vw;
}
::selection{background:#7d1d14;color:#e8ded0}
/* the only light in the room, and it is not steady */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(52% 40% at 50% 46%,rgba(194,112,47,.10),transparent 72%);
  animation:flick 7.3s steps(1,end) infinite;
}
@keyframes flick{
  0%,42%{opacity:.85} 43%{opacity:.5} 45%{opacity:.95} 46%{opacity:.4}
  48%{opacity:.88} 63%{opacity:.88} 64%{opacity:.58} 66%{opacity:1} 100%{opacity:.85}
}
h1{
  font-family:var(--display);font-weight:400;margin:0;
  font-size:clamp(1.5rem,5.6vw,3rem);line-height:1.15;letter-spacing:.1em;
  text-transform:uppercase;color:#d8cdbc;text-wrap:balance;
  text-shadow:0 0 60px rgba(160,26,18,.4);
}
p{margin:0;font-size:clamp(1rem,2.6vw,1.15rem);letter-spacing:.06em;color:var(--ash)}
a{
  justify-self:center;font-family:var(--display);font-size:.8rem;letter-spacing:.3em;
  text-transform:uppercase;color:#ddd2c1;text-decoration:none;
  border:1px solid #4a423a;padding:1.1rem 1.8rem;
  transition:background-color .3s var(--slow),border-color .3s var(--slow),color .3s var(--slow);
}
a:hover,a:focus-visible{
  background:#170907;border-color:var(--blood-lit);color:#f0e5d4;outline:none;
  box-shadow:0 0 34px -12px rgba(201,52,42,.75);
}
@media (prefers-reduced-motion:reduce){ body::before{animation:none} }
@media (prefers-contrast:more){
  h1{color:#fff} p{color:#a2988b} a{border-color:#8b8175;color:#f4ebdc}
}
</style>
</head>
<body>
  <h1>Nothing down this hall.</h1>
  <p>Whatever was here is not here now.</p>
  <!-- Not "/": the site is served from a project path, so the only way
       off the error page landed on the account root, which is GitHub's
       own "Site not found". Verified live. Becomes "/" the day the
       domain does - it is on the switchover list in the README. -->
  <a href="/hauntedmansion-bk/">Back to the door</a>
</body>
