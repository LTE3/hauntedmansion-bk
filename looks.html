<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data:; style-src 'sha256-P9fu5UadxJje5U3o1mMjUL/xNIFh86W857z0Du/l6vU='; font-src 'self'; script-src 'sha256-MMqVcVr0psXnLytkR1p67BWbnvJfPC2F4KgRMu0He/E='; connect-src 'none'; frame-src 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eight looks for the homepage</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050505">
<style>
/* A cycler for the live homepage. The real index.html sits in the frame and
   each look is a handful of CSS rules pushed into its stylesheet through the
   CSSOM (insertRule), which the page's hash-only CSP does not police - so the
   homepage file itself is never edited until a look is chosen. Round one
   picked the display face (Creepster) and the full-screen house; round two,
   the eight here, is the line under the countdown. The chrome is
   deliberately plain: it is the thing being judged that should have the
   atmosphere, not the bench it sits on. */
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlowcondensed-700-latin.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlowcondensed-600-latin.woff2) format("woff2")}
:root{color-scheme:dark;--ink:#050505;--shell:#0d0908;--line:#2a1c19;--bone:#e9ddd2;--ash:#9a8a80;--blood:#ff5b52}
*{box-sizing:border-box}
html,body{height:100%;height:100svh}
body{margin:0;background:var(--ink);color:var(--bone);font:600 15px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.04em;
  display:grid;grid-template-rows:1fr auto;overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{position:relative;background:#000;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#000;opacity:0;transition:opacity .3s ease-out}
iframe.is-in{opacity:1}
@media(min-width:720px){.stage{display:grid;place-items:center;background:#070707}
  iframe{width:390px;height:min(844px,100%);box-shadow:0 0 0 1px #1b1815,0 40px 90px -30px #000}}
.bar{position:relative;z-index:2;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:6px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--shell);border-top:1px solid var(--line);touch-action:pan-y;user-select:none}
.bar button{appearance:none;width:56px;height:56px;border:1px solid var(--line);border-radius:14px;background:#140c0b;color:var(--blood);
  font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer;display:grid;place-items:center}
.bar button:active{background:#2a1210}
.bar button:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
.mid{display:grid;justify-items:center;gap:5px;text-align:center;min-width:0}
.name{font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone)}
.name b{color:var(--blood);font-weight:700;margin-right:.35em}
.note{font-weight:600;font-size:13px;letter-spacing:.05em;color:var(--ash);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dots{display:flex;gap:7px;margin-top:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:#3a2a26}
.dots i.on{background:var(--blood)}
.hint{position:absolute;left:0;right:0;bottom:100%;margin:0;padding:6px 0;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);
  background:linear-gradient(transparent,rgba(5,5,5,.9));pointer-events:none;transition:opacity .4s}
.hint.gone{opacity:0}
@media(prefers-reduced-motion:reduce){iframe,.hint{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <iframe id="frame" title="Homepage preview" src="index.html"></iframe>
</div>
<div class="bar" id="bar">
  <p class="hint" id="hint">Swipe here or tap the arrows</p>
  <button id="prev" aria-label="Previous look">&#8249;</button>
  <div class="mid">
    <div class="name" id="name" aria-live="polite"></div>
    <div class="note" id="note"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>
  <button id="next" aria-label="Next look">&#8250;</button>
</div>
<script>
/* Each look is a list of complete CSS rules. They go in with insertRule at
   the end of the homepage's own stylesheet, so they win on order, and they
   come back out with deleteRule when the next look goes in. Fonts for the
   candidate faces live under v/fonts; the page's font-src is 'self'.

   Round two (2026-09-15): the owner picked Creepster and the full-screen
   house, both now live. These eight change one thing only - the face on the
   "Brooklyn's first full-scale..." line under the countdown. */
var FACES = [
  '@font-face{font-family:"Special Elite";src:url(v/fonts/specialelite-400-latin.woff2) format("woff2")}',
  '@font-face{font-family:"IM Fell English";src:url(v/fonts/imfellenglish-400-latin.woff2) format("woff2")}',
  '@font-face{font-family:"Metamorphous";src:url(v/fonts/metamorphous-400-latin.woff2) format("woff2")}',
  '@font-face{font-family:"Anton";src:url(v/fonts/anton-400-latin.woff2) format("woff2")}',
  '@font-face{font-family:"Rye";src:url(fonts/rye-400-latin.woff2) format("woff2")}',
  '@font-face{font-family:"Grenze Gotisch";font-weight:500;src:url(v/fonts/grenzegotisch-500-latin.woff2) format("woff2")}',
  '@font-face{font-family:"Eater";src:url(v/fonts/eater-400-latin.woff2) format("woff2")}',
  '@font-face{font-family:"Frijole";src:url(v/fonts/frijole-400-latin.woff2) format("woff2")}'
];
/* The line shipped in Barlow Condensed 600, uppercase, clamp(17px,4.6vw,22px),
   with a 15px cut on short landscape phones; the owner picked V5 (Rye) from
   this bench on 2026-09-15 and that is what index.html sets now. Each candidate gets its own
   size, case and tracking; a wide serif needs more room than a condensed
   sans, and blackletter needs more still. */
function lead(fam, weight, size, lh, caps, ls, small) {
  var f = weight + ' ' + size + '/' + lh + ' "' + fam + '",Georgia,serif';
  return [
    '.hero .lead{font:' + f + ';letter-spacing:' + ls + ';text-transform:' + (caps ? 'uppercase' : 'none') + ';text-wrap:balance}',
    '@media(max-height:520px) and (orientation:landscape){.hero-copy .lead{font-size:' + small + '}}'
  ];
}
var LOOKS = [
  { name: 'Typewriter', note: 'Special Elite. Case-file typing, the crime scene angle', rules: lead('Special Elite', 400, 'clamp(17px,4.6vw,21px)', 1.28, false, '.01em', '14px') },
  { name: 'Old book', note: 'IM Fell English. Seventeenth-century ghost story', rules: lead('IM Fell English', 400, 'clamp(19px,5.1vw,24px)', 1.22, false, '0', '16px') },
  { name: 'Gothic', note: 'Metamorphous. Carved serif, still reads at a glance', rules: lead('Metamorphous', 400, 'clamp(17px,4.6vw,21px)', 1.26, false, '.01em', '14px') },
  { name: 'Poster', note: 'Anton, all caps. Heavy tagline under the countdown', rules: lead('Anton', 400, 'clamp(17px,4.6vw,22px)', 1.2, true, '.06em', '15px') },
  { name: 'Carnival', note: 'Rye. Sideshow slab, a little western', rules: lead('Rye', 400, 'clamp(16px,4.3vw,20px)', 1.28, false, '.01em', '14px') },
  { name: 'Blackletter', note: 'Grenze Gotisch. Gothic script you can still read', rules: lead('Grenze Gotisch', 500, 'clamp(20px,5.4vw,25px)', 1.18, false, '0', '17px') },
  { name: 'Eater', note: 'Eater. Rotting letters, the roughest read of the eight', rules: lead('Eater', 400, 'clamp(16px,4.3vw,20px)', 1.35, false, '.01em', '14px') },
  { name: 'Frijole', note: 'Frijole. Chunky carnival horror, sized down to fit', rules: lead('Frijole', 400, 'clamp(14px,3.7vw,17px)', 1.4, false, '.02em', '13px') }
];

var frame = document.getElementById('frame');
var nameEl = document.getElementById('name'), noteEl = document.getElementById('note'), dots = document.getElementById('dots');
var hint = document.getElementById('hint');
var sheet = null, mark = 0, cur = -1;

LOOKS.forEach(function () { dots.appendChild(document.createElement('i')); });

function fromHash() {
  var n = parseInt((location.hash || '').replace('#v', ''), 10);
  return n >= 1 && n <= LOOKS.length ? n - 1 : 0;
}
function apply(i) {
  if (!sheet) return;
  while (sheet.cssRules.length > mark) sheet.deleteRule(sheet.cssRules.length - 1);
  LOOKS[i].rules.forEach(function (r) { sheet.insertRule(r, sheet.cssRules.length); });
}
function show(i, push) {
  cur = (i + LOOKS.length) % LOOKS.length;
  apply(cur);
  nameEl.innerHTML = '<b>V' + (cur + 1) + '</b>' + LOOKS[cur].name;
  noteEl.textContent = LOOKS[cur].note;
  Array.prototype.forEach.call(dots.children, function (d, k) { d.className = k === cur ? 'on' : ''; });
  if (push !== false) history.replaceState(null, '', '#v' + (cur + 1));
  document.title = 'V' + (cur + 1) + ' ' + LOOKS[cur].name + ' - Eight looks for the homepage';
}
frame.addEventListener('load', function () {
  var doc = frame.contentDocument;
  var sheets = doc ? Array.prototype.slice.call(doc.styleSheets) : [];
  sheet = sheets.filter(function (s) { return s.ownerNode && s.ownerNode.tagName === 'STYLE'; }).pop() || null;
  if (sheet) {
    FACES.forEach(function (r) { sheet.insertRule(r, sheet.cssRules.length); });
    mark = sheet.cssRules.length;
  }
  show(fromHash(), false);
  frame.classList.add('is-in');
});
document.getElementById('prev').addEventListener('click', function () { show(cur - 1); });
document.getElementById('next').addEventListener('click', function () { show(cur + 1); });
window.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft') show(cur - 1);
  if (e.key === 'ArrowRight') show(cur + 1);
});
window.addEventListener('hashchange', function () { show(fromHash(), false); });

/* Swipe on the bar, not on the page: the page needs its own touches. */
var x0 = null;
var bar = document.getElementById('bar');
bar.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
bar.addEventListener('touchend', function (e) {
  if (x0 === null) return;
  var dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) show(dx < 0 ? cur + 1 : cur - 1);
}, { passive: true });
setTimeout(function () { hint.classList.add('gone'); }, 4000);
</script>
</body>
</html>
