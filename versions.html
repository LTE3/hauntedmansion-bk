<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five builds of the house</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
/* The cycler is a workbench, not a haunted house. It borrows the ink and the
   ember so the two do not fight, but it stays deliberately plain: any
   atmosphere in here would be atmosphere competing with the thing being
   judged. Chrome on top, page below, nothing else. */
:root{
  color-scheme:dark;
  --ink:#050505;
  --shell:#0b0a0a;
  --line:#221f1c;
  --bone:#cfc4b4;
  --ash:#8b8177;
  --ember:#c2702f;
  --blood:#c9342a;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --display:"Cinzel","Cormorant Garamond",Georgia,serif;
  --slow:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--bone);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:auto 1fr;overflow:hidden;
}
::selection{background:#7d1d14;color:#e8ded0}

/* ---------- chrome ---------- */
header{
  background:var(--shell);border-bottom:1px solid var(--line);
  padding:.65rem max(.7rem,env(safe-area-inset-left)) .55rem;
  display:grid;gap:.5rem;
}
.top{display:flex;align-items:baseline;gap:.8rem;padding-inline:.25rem}
.top h1{
  font-family:var(--display);font-weight:400;font-size:.72rem;letter-spacing:.24em;
  text-transform:uppercase;margin:0;color:#ded3c2;white-space:nowrap;
}
.top .n{margin-left:auto;font-size:.8rem;letter-spacing:.12em;color:var(--ash);white-space:nowrap}
.top .n b{color:var(--bone);font-weight:400}

/* Pills scroll on a phone rather than wrapping to a second row that would push
   the page itself further down. Snap, so a thumb always lands on a whole one. */
.pills{
  display:flex;gap:.4rem;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;padding:.1rem .25rem .25rem;
}
.pills::-webkit-scrollbar{display:none}
.pill{
  scroll-snap-align:start;flex:0 0 auto;position:relative;
  background:none;border:1px solid var(--line);border-radius:0;
  color:var(--ash);font-family:var(--display);font-size:.66rem;letter-spacing:.18em;
  text-transform:uppercase;padding:.62rem .85rem;cursor:pointer;
  transition:color .25s var(--slow),border-color .25s var(--slow),background-color .25s var(--slow);
}
.pill:hover{color:#ded3c2;border-color:#3a332c}
.pill[aria-selected="true"]{color:#f0e5d4;border-color:#4a3a2a;background:#150e08}
.pill[aria-selected="true"]::after{
  content:"";position:absolute;left:.85rem;right:.85rem;bottom:-1px;height:1px;
  background:var(--ember);box-shadow:0 0 12px 1px rgba(194,112,47,.55);
}
.pill:focus-visible{outline:1px solid var(--ember);outline-offset:2px}
.pill .num{color:var(--ember);margin-right:.45em;opacity:.8}
/* Builds 6-8 answer a different question than 1-5 - not what is on the page
   but what it sounds like - so the row breaks rather than pretending it is one
   continuous history. */
.pill.is-type{margin-left:0}
.pill.is-type:first-of-type{margin-left:0}
.pills .pill.is-type:nth-of-type(6){margin-left:1.4rem;position:relative}
.pills .pill.is-type:nth-of-type(6)::before{
  content:"type";position:absolute;left:-1.4rem;top:50%;translate:-50% -50%;rotate:-90deg;
  font-size:.42rem;letter-spacing:.2em;color:#4a423a;
}
.pill.is-live{border-color:#3d2a26}
.pill.is-live::before{
  content:"";position:absolute;top:.42rem;right:.42rem;width:4px;height:4px;
  border-radius:50%;background:var(--blood);box-shadow:0 0 8px 1px rgba(201,52,42,.8);
}

.meta{
  display:flex;align-items:center;gap:.7rem;padding:0 .35rem .1rem;
  font-size:.88rem;color:var(--ash);min-height:1.35rem;
}
.meta .what{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .what em{color:#c3b8a8;font-style:normal}
.meta a{
  flex:0 0 auto;color:var(--ash);text-decoration:none;font-family:var(--display);
  font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid var(--line);padding:.42rem .62rem;
  transition:color .25s var(--slow),border-color .25s var(--slow);
}
.meta a:hover,.meta a:focus-visible{color:#f0e5d4;border-color:var(--blood);outline:none}
/* Builds 3, 4 and 5 are identical above the fold - everything that separates
   them is further down. A cycler that only ever shows the top of the page is a
   cycler that cannot answer the question, so the position is part of the state
   and it survives the switch. */
.meta .arrows{flex:0 0 auto;display:flex;gap:.3rem}
.meta button{
  background:none;border:1px solid var(--line);color:var(--ash);
  width:2.1rem;height:2.1rem;cursor:pointer;font-size:.95rem;line-height:1;
  transition:color .25s var(--slow),border-color .25s var(--slow);
}
.meta button:hover{color:#f0e5d4;border-color:#4a3a2a}
.meta button:disabled{opacity:.3;cursor:default}
.meta button:focus-visible{outline:1px solid var(--ember);outline-offset:2px}

/* Builds 3, 4 and 5 are identical above the fold - everything that separates
   them is further down. A cycler that only ever shows the top of the page is a
   cycler that cannot answer the question, so where you are standing is part of
   the state and it survives the switch.
   Written after .meta button and with its specificity, or the arrow sizing wins
   and squashes four words into the width of one. */
.meta .spots{flex:0 0 auto;display:flex;gap:0;border:1px solid var(--line)}
.meta .spots button{
  border:0;border-left:1px solid var(--line);width:auto;height:1.95rem;
  padding:0 .68rem;font-family:var(--display);font-size:.58rem;letter-spacing:.16em;
  text-transform:uppercase;
}
.meta .spots button:first-child{border-left:0}
.meta .spots button:hover{border-color:var(--line);color:#ded3c2}
.meta .spots button[aria-pressed="true"]{color:#f0e5d4;background:#150e08}

/* ---------- the stage ---------- */
.stage{position:relative;background:#000;overflow:hidden}
iframe{
  display:block;width:100%;height:100%;border:0;background:#000;
  opacity:0;transition:opacity .32s var(--slow);
}
iframe.is-in{opacity:1}
/* On a wide screen you can hold the phone layout with nothing beside it, which
   is the only honest way to judge a page most people will meet on a phone. */
.stage.is-narrow{display:grid;place-items:center;background:#070707}
.stage.is-narrow iframe{
  width:390px;height:min(844px,100%);
  box-shadow:0 0 0 1px #1b1815,0 40px 90px -30px #000;
}
/* The last three builds are the same picture until you scroll. Without this,
   clicking between them looks like clicking a broken button. */
.nudge{
  position:absolute;left:50%;bottom:1.6rem;translate:-50% 0;margin:0;
  background:rgba(10,8,7,.92);border:1px solid #3a2a1c;color:#e0d5c4;
  font-size:.86rem;letter-spacing:.02em;padding:.7rem 1.1rem;
  box-shadow:0 18px 40px -18px #000;max-width:min(90vw,26rem);text-align:center;
  animation:nudgeIn .5s var(--slow) both;cursor:pointer;
}
.nudge:hover{border-color:var(--ember)}
.nudge b{color:var(--ember);font-weight:400}
@keyframes nudgeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .nudge{animation:none} }

.width-toggle{display:none}
@media (min-width:900px){ .width-toggle{display:inline-flex} }
@media (max-width:520px){
  /* On a phone the chrome was eating a third of the screen to tell you the name
     of a page you just opened. The pills already say which build you are on. */
  header{padding:.45rem .5rem .4rem;gap:.4rem}
  .top{display:none}
  .pill{font-size:.62rem;padding:.55rem .7rem}
  .meta{font-size:.8rem;gap:.5rem;flex-wrap:wrap}
  /* the sentence takes its own line so the controls stay a full thumb wide */
  .meta .what{flex:1 0 100%;white-space:normal;line-height:1.25;max-height:2.5em}
  .meta .spots{flex:1 1 auto}
  .meta .spots button{flex:1 1 0;padding:0 .3rem}
}
@media (prefers-reduced-motion:reduce){ iframe{transition:none} }
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>Haunted Mansion BK &middot; builds</h1>
    <span class="n"><b id="pos">5</b>&thinsp;/&thinsp;5</span>
  </div>

  <div class="pills" role="tablist" aria-label="Builds"></div>

  <div class="meta">
    <span class="what" id="what"></span>
    <span class="spots" id="spots" role="group" aria-label="Where in the page"></span>
    <a class="width-toggle" id="wt" href="#" role="button">Phone</a>
    <a id="open" href="#" target="_blank" rel="noopener">Open</a>
    <span class="arrows">
      <button id="prev" aria-label="Previous build">&#8249;</button>
      <button id="next" aria-label="Next build">&#8250;</button>
    </span>
  </div>
</header>

<div class="stage" id="stage">
  <iframe id="frame" title="Build preview" src="about:blank"></iframe>
  <p class="nudge" id="nudge" hidden>Same photo up here &mdash; tap <b>Inside</b> to see what changed</p>
</div>

<script>
/* Five real builds. Every entry is a file that exists and opens on its own -
   the actual page as it stood at that commit, with only its asset paths moved
   down a folder and a preview harness added (see the note at the top of any of
   them). Nothing here is a mockup of a version that never shipped. */
var BUILDS = [
  { id:"1-first",    tab:"Old house",
    what:"<em>The first one.</em> A big porch, and the picture moved. Bottom half of the page was still empty." },
  { id:"2-depth",    tab:"Bottom half",
    what:"<em>Same house, better page.</em> Everything under the photo got built: bigger words, a lit-up sign-up." },
  { id:"3-brooklyn", tab:"New house", diff:true,
    what:"<em>New house.</em> A Bushwick building instead of a mansion. Nothing added below yet." },
  { id:"4-hallway",  tab:"Hallway", live:true, diff:true,
    what:"<em>Added a hallway photo</em> halfway down the page. This is the one that is live." },
  { id:"5-stairs",   tab:"Staircase", diff:true,
    what:"<em>Adds a staircase photo</em> behind the sign-up boxes. Not live - this is the one to say yes or no to." },
  { id:"6-editorial", tab:"Type A", diff:true, type:true,
    what:"<em>Same photos, different words.</em> Normal capitals instead of all-caps, everything lined up on the left, one big quiet headline." },
  { id:"7-casefile",  tab:"Type B", diff:true, type:true,
    what:"<em>Typewriter.</em> Reads like a police file, not a poster. Small text, lots of black, the photo does all the talking." },
  { id:"8-poster",    tab:"Type C", diff:true, type:true,
    what:"<em>Loud.</em> Huge blocky headline running off the edge. Horror trailer, not wedding invitation." },
  { id:"9-original",  tab:"Cali art", diff:true, type:true,
    what:"<em>The original drawing is back.</em> The storefront with the skeletons and the COMING SOON sign, in today's page." },
  { id:"10-original-poster", tab:"Cali + C", diff:true, type:true,
    what:"<em>The drawing with the loud type.</em> Original art up top, Anton headline over it." },
  { id:"11-drawn",  tab:"All drawn", diff:true, type:true,
    what:"<em>Drawings the whole way down.</em> The storefront, then a red door, then a boarded-up window - all painted, no photos anywhere." },
  { id:"12-photo",  tab:"Photos fixed", diff:true, type:true,
    what:"<em>Same photos, fixed.</em> The red was smeared over every picture; now it only comes off the doors, so the rooms look cold and the light looks warm." },
  { id:"13-split",  tab:"Both", diff:true, type:true,
    what:"<em>Drawing outside, photo inside.</em> Painted storefront up top, and the hallway is framed like a real photograph taped onto it." },
  { id:"14-keyhole", tab:"Keyhole", diff:false, type:true,
    what:"<em>You are looking through a keyhole.</em> The first screen is a keyhole cut out of the dark with the house lit behind it. Two buttons, and after five seconds the invitation opens by itself." },
  { id:"15-livingdoor", tab:"Living door", diff:false, type:true,
    what:"<em>One door, breathing.</em> A single door fills the whole screen and slowly swells, like something behind it is asleep. The only thing to press is the knocker." },
  { id:"16-thelist", tab:"The list", diff:false, type:true,
    what:"<em>Invitation only.</em> Built on being left out rather than on being scared - not everyone gets in, the list is private, and signing up is written as being let through a door." }
];

var pills = document.querySelector(".pills");
var frame = document.getElementById("frame");
var stage = document.getElementById("stage");
var what  = document.getElementById("what");
var open_ = document.getElementById("open");
var pos   = document.getElementById("pos");
var prev  = document.getElementById("prev");
var next  = document.getElementById("next");
var wt    = document.getElementById("wt");
var nudge = document.getElementById("nudge");
var spotsEl = document.getElementById("spots");
var cur   = -1;

/* Where to stand. The selectors are ordered fallbacks because the early builds
   do not have the later sections - build 1 has no interior plate to look at,
   so "inside" lands on the facts line that was there instead. */
var SPOTS = [
  { k:"top",    label:"Top",    sel:null },
  { k:"inside", label:"Inside", sel:[".plate", ".facts", ".story", ".doorworld"] },
  { k:"signup", label:"Signup", sel:[".bay", ".rulecard", ".story", ".copy"] },
  { k:"end",    label:"End",    sel:[".close", ".counter", ".story", ".copy"] }
];
var spot = 0;

SPOTS.forEach(function(s, i){
  var el = document.createElement("button");
  el.textContent = s.label;
  el.setAttribute("aria-pressed", i === 0 ? "true" : "false");
  el.addEventListener("click", function(){
    spot = i;
    for(var k = 0; k < spotsEl.children.length; k++)
      spotsEl.children[k].setAttribute("aria-pressed", k === i ? "true" : "false");
    nudge.hidden = !(BUILDS[cur] && BUILDS[cur].diff && spot === 0);
    place();
  });
  spotsEl.appendChild(el);
});

// Same origin, so the frame is reachable. Anything unreachable is not worth
// throwing over - the preview just stays where it is.
function place(){
  var doc;
  try { doc = frame.contentDocument; } catch(e){ return; }
  if(!doc || !doc.body) return;
  var s = SPOTS[spot];
  if(!s.sel){ doc.documentElement.scrollTop = doc.body.scrollTop = 0; return; }
  // Below the top there is no ceremony to watch: the curtain is a fixed black
  // sheet over the whole viewport, so arriving mid-page during it means
  // arriving at nothing. is-open is the page's own second-visit state.
  doc.documentElement.classList.add("is-open");
  var el = null;
  for(var i = 0; i < s.sel.length && !el; i++) el = doc.querySelector(s.sel[i]);
  if(el) el.scrollIntoView({block: s.k === "signup" ? "center" : "start"});
}

BUILDS.forEach(function(b, i){
  var el = document.createElement("button");
  el.className = "pill" + (b.live ? " is-live" : "");
  el.setAttribute("role", "tab");
  el.innerHTML = '<span class="num">' + (i + 1) + '</span>' + b.tab;
  if(b.type) el.classList.add("is-type");
  el.addEventListener("click", function(){ show(i); });
  pills.appendChild(el);
});
var els = pills.querySelectorAll(".pill");

function show(i){
  if(i < 0 || i >= BUILDS.length || i === cur) return;
  cur = i;
  var b = BUILDS[i];
  for(var k = 0; k < els.length; k++){
    els[k].setAttribute("aria-selected", k === i ? "true" : "false");
  }
  els[i].scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  what.innerHTML = b.what;
  // only where it is true: builds 3, 4 and 5 share a hero, 1 and 2 do not
  nudge.hidden = !(b.diff && spot === 0);
  open_.href = "v/" + b.id + ".html";
  pos.textContent = i + 1;
  prev.disabled = i === 0;
  next.disabled = i === BUILDS.length - 1;
  // Fade out, swap, fade back in on load. A hard cut between two dark pages
  // reads as a flicker, and you cannot tell which one you are looking at.
  frame.classList.remove("is-in");
  frame.src = "v/" + b.id + ".html";
  if(history.replaceState) history.replaceState(null, "", "#" + (i + 1));
}
frame.addEventListener("load", function(){
  if(frame.src.indexOf("about:blank") === -1){
    // place before the fade, so the jump is never something you watch happen
    place();
    requestAnimationFrame(function(){ frame.classList.add("is-in"); });
  }
});

prev.addEventListener("click", function(){ show(cur - 1); });
next.addEventListener("click", function(){ show(cur + 1); });
document.addEventListener("keydown", function(e){
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key === "ArrowLeft")  show(cur - 1);
  if(e.key === "ArrowRight") show(cur + 1);
  var n = parseInt(e.key, 10);
  if(n >= 1 && n <= BUILDS.length) show(n - 1);
});

nudge.addEventListener("click", function(){ spotsEl.children[1].click(); });

wt.addEventListener("click", function(e){
  e.preventDefault();
  var narrow = stage.classList.toggle("is-narrow");
  wt.textContent = narrow ? "Full" : "Phone";
});

// A build is a link: #3 opens on Brooklyn, and the address bar keeps up as you
// move, so any one of these is something you can send to somebody.
var start = parseInt((location.hash || "").replace("#", ""), 10);
show(start >= 1 && start <= BUILDS.length ? start - 1 : BUILDS.length - 1);
</script>
</body>
</html>
